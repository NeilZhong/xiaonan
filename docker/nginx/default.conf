server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # File Viewer 的 WASM/Worker/字体等静态资产（前端构建时由 @file-viewer/vite-plugin
    # 拷进 dist/vendor/，已本地化、可内网离线）。缺失时必须返回真实 404，
    # 不能 fallback 到 SPA 的 index.html——否则浏览器请求 .wasm 却拿到 text/html，
    # 会因 MIME 不匹配导致 WASM 加载失败、预览打不开。
    location /vendor/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}
